[package]
name = "glint"
version = "0.1.0"
edition = "2024"

[lib]
name = "glint"
path = "src/lib.rs"

[[bin]]
name = "glint"
path = "src/main.rs"

[[bin]]
name = "set_example"
path = "src/examples/set/main.rs"

[[bin]]
name = "time_example"
path = "src/examples/time/main.rs"

[[bin]]
name = "openai_example"
path = "src/examples/openai/main.rs"

[dependencies]
chrono = "0.4.41"
regex = "1.10.0"
reqwest = { version = "0.12.0", features = ["json", "blocking"] }
base64 = "0.22.0"
hex = "0.4.3"
serde = { version ="1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }

[dev-dependencies]
uuid = { version = "1.18.0", features = ["v4"] }
